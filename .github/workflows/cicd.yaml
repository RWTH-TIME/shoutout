name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  quality-dashboard:
    name: Dashboard quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck / production build
        run: npm run build

      - name: Audit report
        run: npm audit --audit-level=moderate || true

      - name: Audit (critical)
        run: npm audit --audit-level=critical

  quality-worker:
    name: Worker quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint/audit tools
        run: pip install flake8 pip-audit

      - name: Flake8
        run: flake8 shoutout_worker

      - name: Validate packaging metadata
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"

      - name: Dependency audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Flake show
        run: nix flake show --json > /tmp/flake-show.json
      - name: Flake check (current system, eval only)
        run: nix flake check --no-build --keep-going
      - name: Evaluate NixOS modules
        run: |
          nix-instantiate --eval --strict --expr '
            let
              flake = builtins.getFlake (toString ./.);
            in
            builtins.isAttrs flake.nixosModules
            && flake.nixosModules ? shoutout
            && flake.nixosModules ? shoutout-worker
          '

  smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [quality-dashboard, quality-worker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps for seed helper
        working-directory: dashboard
        run: npm ci && npx prisma generate

      - name: Build and start smoke stack
        run: |
          set +x
          chmod +x scripts/garage-bootstrap.sh scripts/smoke-test.sh
          # Compose validates env_file paths even for unrelated services.
          printf 'S3_ACCESS_KEY_ID=placeholder\nS3_SECRET_ACCESS_KEY=placeholder\nS3_BUCKET=shoutout-job-bucket\n' > .garage-creds.env
          docker compose -f docker-compose.smoke.yml build
          docker compose -f docker-compose.smoke.yml up -d postgres garage
          COMPOSE_FILE=docker-compose.smoke.yml ./scripts/garage-bootstrap.sh
          grep -q '^S3_ACCESS_KEY_ID=GK' .garage-creds.env
          docker compose -f docker-compose.smoke.yml up -d --force-recreate dashboard

      - name: Wait for dashboard
        run: |
          set +x
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/auth >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.smoke.yml logs dashboard || true
          exit 1

      - name: Run smoke test
        env:
          BASE_URL: http://localhost:8000
          DATABASE_URL: postgresql://admin:admin@localhost:5433/postgres?schema=public
          WORKER_ENROLLMENT_TOKEN: dev-worker-enrollment-token
        run: ./scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          test -f .garage-creds.env || printf 'S3_BUCKET=shoutout-job-bucket\n' > .garage-creds.env
          docker compose -f docker-compose.smoke.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: |
          test -f .garage-creds.env || printf 'S3_BUCKET=shoutout-job-bucket\n' > .garage-creds.env
          docker compose -f docker-compose.smoke.yml down -v || true

  e2e:
    name: Compose e2e (worker)
    runs-on: ubuntu-latest
    needs: [quality-dashboard, quality-worker]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps for seed helper
        working-directory: dashboard
        run: npm ci && npx prisma generate

      - name: Build and start e2e stack
        run: |
          set +x
          chmod +x scripts/garage-bootstrap.sh scripts/e2e-test.sh
          printf 'S3_ACCESS_KEY_ID=placeholder\nS3_SECRET_ACCESS_KEY=placeholder\nS3_BUCKET=shoutout-job-bucket\n' > .garage-creds.env
          docker compose -f docker-compose.e2e.yml build
          docker compose -f docker-compose.e2e.yml up -d postgres garage
          COMPOSE_FILE=docker-compose.e2e.yml ./scripts/garage-bootstrap.sh
          grep -q '^S3_ACCESS_KEY_ID=GK' .garage-creds.env
          docker compose -f docker-compose.e2e.yml up -d --force-recreate dashboard worker

      - name: Wait for dashboard and worker
        run: |
          set +x
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/auth >/dev/null; then
              if docker compose -f docker-compose.e2e.yml logs worker 2>/dev/null | grep -q 'Registered worker'; then
                exit 0
              fi
            fi
            sleep 3
          done
          docker compose -f docker-compose.e2e.yml logs --no-color || true
          exit 1

      - name: Run e2e test
        env:
          BASE_URL: http://localhost:8000
          DATABASE_URL: postgresql://admin:admin@localhost:5433/postgres?schema=public
          E2E_TIMEOUT_SECONDS: "900"
        run: ./scripts/e2e-test.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          test -f .garage-creds.env || printf 'S3_BUCKET=shoutout-job-bucket\n' > .garage-creds.env
          docker compose -f docker-compose.e2e.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: |
          test -f .garage-creds.env || printf 'S3_BUCKET=shoutout-job-bucket\n' > .garage-creds.env
          docker compose -f docker-compose.e2e.yml down -v || true

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [quality-dashboard, quality-worker, nix, smoke, e2e]
    steps:
      - name: All required checks passed
        run: echo "quality gate green"

  build-images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: dashboard
            image: dashboard
            model: ""
          - context: worker
            image: worker-tiny
            model: tiny
          - context: worker
            image: worker-turbo
            model: turbo
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.context }}
          tags: |
            type=raw, value=${{ matrix.model }}, enable=${{ matrix.model != '' }}
            type=raw, value=latest, enable=${{ matrix.image == 'dashboard' || matrix.image == 'worker-turbo' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            WHISPER_MODEL=${{ matrix.model }}
            HUGGINGFACE=${{ secrets.HUGGINGFACE_APIKEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
