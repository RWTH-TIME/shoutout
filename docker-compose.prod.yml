services:
  dashboard:
    image: ghcr.io/rwth-time/shoutout/dashboard
    restart: always
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/postgres?schema=public
      - S3_ENDPOINT=http://garage:3900
      - S3_PUBLIC_ENDPOINT=http://localhost:3900
      - S3_WORKER_ENDPOINT=${S3_WORKER_ENDPOINT:-http://garage:3900}
      - S3_REGION=garage
      - S3_ACCESS_KEY_ID=shoutoutdevuser
      - S3_SECRET_ACCESS_KEY=shoutoutdevuser
      - S3_BUCKET=shoutout-job-bucket
      - WORKER_ENROLLMENT_TOKEN=${WORKER_ENROLLMENT_TOKEN}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - OIDC_PROVIDER=${OIDC_PROVIDER}
      - OIDC_INTERNAL_PROVIDER=${OIDC_INTERNAL_PROVIDER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - LISTMONK_URL=${LISTMONK_URL:-}
      - LISTMONK_USERNAME=${LISTMONK_USERNAME:-}
      - LISTMONK_TOKEN=${LISTMONK_TOKEN:-}
      - LISTMONK_TEMPLATE_ID=${LISTMONK_TEMPLATE_ID:-0}
      - JOB_EXPIRATION_DAYS=${JOB_EXPIRATION_DAYS:-14}
    depends_on:
      - postgres
      - garage

  worker:
    image: ghcr.io/rwth-time/shoutout/worker-tiny
    restart: always
    environment:
      - DASHBOARD_URL=http://dashboard
      - WORKER_ENROLLMENT_TOKEN=${WORKER_ENROLLMENT_TOKEN}
      - WHISPER_MODELS=tiny,small
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_APIKEY}
      - LOG_LEVEL=INFO
    depends_on:
      - dashboard
    deploy:
      mode: replicated
      replicas: 2
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - shoutout-db-data:/var/lib/postgresql/data

  garage:
    image: dxflrs/garage:v2.0.0
    restart: always
    volumes:
      - ./conf/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3903:3903"

volumes:
  shoutout-db-data:
  garage_meta:
  garage_data:
