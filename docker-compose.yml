services:
  dashboard:
    build: dashboard
    restart: always
    ports:
      - "8000:80"
    env_file:
      - .garage-creds.env
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/postgres?schema=public
      - S3_ENDPOINT=http://garage:3900
      - S3_PUBLIC_ENDPOINT=http://localhost:3900
      - S3_REGION=garage
      - WORKER_ENROLLMENT_TOKEN=dev-worker-enrollment-token
      - NEXTAUTH_URL=http://localhost:8000
      - NEXTAUTH_SECRET=random-auth-secret
      - OIDC_PROVIDER=http://localhost:8090/realms/main
      - OIDC_CLIENT_ID=shoutout
      - OIDC_CLIENT_SECRET=shoutout-client-secret
    depends_on:
      - postgres
      - garage

  worker:
    build:
      context: worker
      args:
        - HUGGINGFACE=${HUGGINGFACE_APIKEY:-}
        - WHISPER_MODEL=tiny
    restart: always
    environment:
      - DASHBOARD_URL=http://dashboard
      - WORKER_ENROLLMENT_TOKEN=dev-worker-enrollment-token
      - WHISPER_MODELS=tiny,small
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_APIKEY:-}
      - LOG_LEVEL=INFO
      - CONCURRENCY=1
    depends_on:
      - dashboard
    deploy:
      mode: replicated
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - shoutout-db-data:/var/lib/postgresql/data

  garage:
    image: dxflrs/garage:v2.0.0
    restart: always
    volumes:
      - ./conf/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3902:3902"
      - "3903:3903"

  job-cleaner:
    build: dashboard
    entrypoint: ["sh", "-c", "npx tsx scripts/cleanup.ts"]
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/postgres?schema=public
      - S3_ENDPOINT=http://garage:3900
      - S3_PUBLIC_ENDPOINT=http://garage:3900
      - S3_ACCESS_KEY_ID=shoutoutdevuser
      - S3_SECRET_ACCESS_KEY=shoutoutdevuser
      - S3_BUCKET=shoutout-job-bucket
    depends_on:
      - postgres
      - garage
    restart: "no"

  keycloak-postgres:
    image: postgres:17
    volumes:
      - "keycloak-postgres-data:/var/lib/postgresql/data"
    environment:
      POSTGRES_DB: "keycloak"
      POSTGRES_USER: "keycloak"
      POSTGRES_PASSWORD: "password"

  keycloak:
    image: quay.io/keycloak/keycloak
    environment:
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-postgres:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "password"
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_LOG_LEVEL: "info"
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
    command: start-dev --import-realm
    ports:
      - "8090:8080"
    depends_on:
      - keycloak-postgres
    volumes:
      - ./.keycloak-config:/opt/keycloak/data/import

volumes:
  shoutout-db-data:
  garage_meta:
  garage_data:
  keycloak-postgres-data:
