[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shoutout-worker"
version = "0.2.0"
description = "shoutout transcription worker"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "numpy==2.5.4",
  "openai-whisper==20250625",
  "pandas==3.1.0",
  "pyannote.audio==4.0.7",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "python-dotenv==1.2.4",
  "torch==2.15.0",
  "torchaudio==2.11.1",
  "typing_extensions==4.16.0",
  "urllib3==2.8.0",
]

[project.scripts]
shoutout-worker = "shoutout_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shoutout_worker*"]
