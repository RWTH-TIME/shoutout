[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shoutout-worker"
version = "0.2.0"
description = "Shoutout transcription worker"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "numpy>=2.0.0",
  "openai-whisper>=20250625",
  "pandas>=2.2.0",
  "pyannote.audio>=4.0.7",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.2",
  "python-dotenv>=1.2.4",
  "torch>=2.12.0",
  "torchaudio>=2.11.0",
  "typing_extensions>=4.16.0",
  "urllib3>=2.5.0",
]

[project.scripts]
shoutout-worker = "shoutout_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shoutout_worker*"]
